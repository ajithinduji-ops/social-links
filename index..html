<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apna Dairy | Connect With Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            background: #eee;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .tagline {
            color: #666;
            margin-bottom: 28px;
            font-size: 15px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: white;
            padding: 16px;
            margin: 14px 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .instagram {
            background: #111;
        }

        .facebook {
            background: #1877F2;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Apna Dairy</h1>

        <p class="tagline">
            Connect with us
        </p>

        <a
            class="btn instagram"
            href="https://www.instagram.com/apnadairy_/"
            target="_blank">
            📸 Instagram
        </a>

        <a
            class="btn facebook"
            href="https://www.facebook.com/share/1FCj9rX1xY/"
            target="_blank">
            👍 Facebook
        </a>

        <div class="footer">
            © Apna Dairy
        </div>

    </div>

</body>
</html>
